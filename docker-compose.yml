# 兩個 services、同一個 network
# 只 publish nginx 的 80（app 不 publish）

version: "3.8"

services:
  app:
    image: rachel2037/anonboard:0.2
    env_file:
      - /home/ubuntu/.env
    expose:
      - "8000"
    restart: always
    networks:
      - webnet

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro

      # Let’s Encrypt 憑證
      - /etc/letsencrypt:/etc/letsencrypt:ro

      # HTTP-01 challenge webroot
      - ./certbot/www:/var/www/certbot:ro
      
    restart: always
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
