# 讓 Nginx 成為前端入口，同時把 /api/ 轉給後端 app
## / 與靜態檔由 nginx 直接 serve（web/）
## /api/ 反代到 http://app:8000
## /health 反代到 http://app:8000/health，讓 ALB health check 真正測到 app。因為 ALB 健康檢查打到的是 EC2:80（= Nginx），不是 app:8000，如果沒改，在app 容器掛了（或卡死），Nginx 還活著時，/health 永遠 200 → ALB 永遠覺得 Healthy；有轉發，app 掛了 → Nginx 拿不到上游回應 → 回 502/504，ALB 看到非200 → 把 target 標成 Unhealthy → 不再送使用者流量。

server {
  listen 80; # 監聽 80 port
  server_name _; # 接收所有 host

  root /usr/share/nginx/html; # 指定靜態檔根目錄
  index index.html; # 預設首頁

  # ALB health check：直接轉給後端 app 回應，才能確保 app 掛了就 fail
  location = /health {
    access_log off;
    proxy_pass http://app:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # ALB 會帶 X-Forwarded-Proto: https，這裡轉給 app
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # API reverse proxy
  location /api/ {
    proxy_pass http://app:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # timeout 設定避免上游卡住
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # SPA fallback（刷新非檔案路徑時回 index.html），讓前端路由可用
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 基本安全：不讓人抓到 dotfile，阻擋 .env、.git 等隱藏檔被存取
  location ~ /\.(?!well-known) {
    deny all;
  }
}