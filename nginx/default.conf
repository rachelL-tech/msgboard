# 讓 Nginx 成為前端入口，同時把 /api/ 轉給後端 app
## / 與靜態檔由 nginx 直接 serve（web/）

# 80：保留 challenge/health，其餘轉 https
server {
  listen 80;
  server_name rachel-create.com www.rachel-create.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location = /health {
    access_log off;
    proxy_pass http://app:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 443：正式服務
server {
  listen 443 ssl;
  server_name rachel-create.com www.rachel-create.com;

  ssl_certificate     /etc/letsencrypt/live/rachel-create.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rachel-create.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  # 直接轉給後端 app 回應，才能確保 app 掛了就 fail
  location = /health {
    access_log off;
    proxy_pass http://app:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API reverse proxy
  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback（刷新非檔案路徑時回 index.html），讓前端路由可用
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 基本安全：不讓人抓到 dotfile，阻擋 .env、.git 等隱藏檔被存取
  location ~ /\.(?!well-known) {
    deny all;
  }
}